<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MAX Web Chat</title>
    <!-- Тема до первой отрисовки, чтобы не мигала светлая. Правило то же, что в src/app/theme.ts. -->
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('max-web-chat:theme'); } catch (e) {}
        var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
